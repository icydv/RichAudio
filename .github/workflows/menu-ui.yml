name: RichAudio F10 sidebar (offline only)

on:
  pull_request:
    paths:
      - ".github/workflows/menu-ui.yml"
      - "src/acoustics/settings/InGame/**"
      - "src/acoustics/bridge/Rph/InGameMenu.Rph.cs"
      - "tests/menu/**"
      - "tools/Test-InGameMenu.ps1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  menu:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # pinned publisher v6
        with:
          persist-credentials: false
      - name: Compile and exercise actual SDK-independent F10 menu
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          ./tools/Test-InGameMenu.ps1
          if ($LASTEXITCODE -ne 0) { throw 'F10 menu acceptance failed' }
      - name: Retain original-only controlled menu previews
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # pinned v4.6.2
        with:
          name: richaudio-f10-sidebar-preview
          path: |
            .local/in-game-menu-*/richaudio-menu-1920x1080.png
            .local/in-game-menu-*/richaudio-sidebar-cursor.png
            .local/in-game-menu-*/richaudio-opening-110ms.png
          if-no-files-found: error
          retention-days: 7
