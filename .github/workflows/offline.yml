name: Offline validation (no game runtime)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: offline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # publisher v6 ref, reviewed 2026-10-25
        with:
          persist-credentials: false
          # The regression runs the exact pre-fix relay and producer source.
          fetch-depth: 0
      - name: Build core and run offline fixtures, evidence and documentation checks
        shell: pwsh
        run: ./tools/Test-Offline.ps1
      - name: Retain bounded sanitized expiry diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2, verified official tag
        with:
          name: expiry-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: .local/expiry-ci-evidence/*.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
