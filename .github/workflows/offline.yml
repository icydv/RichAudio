name: Offline validation (no game runtime)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: offline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # publisher v6 ref, reviewed 2026-10-25
        with:
          persist-credentials: false
          # The regression runs the exact pre-fix relay and producer source.
          fetch-depth: 0
      - name: Validate bounded headless initialization, original NG geometry, processing and inherited offline suites
        shell: pwsh
        run: ./tools/Test-Offline09.ps1
      - name: Retain validated companion package and sanitized summary
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2, reused reviewed official pin
        with:
          name: world08-companion-${{ github.run_id }}-${{ github.run_attempt }}
          path: .local/world09-offline-*/artifact/*
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - name: Retain bounded sanitized expiry diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2, reused reviewed official pin
        with:
          name: expiry-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: .local/expiry-ci-evidence/*.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
      - name: Retain original-only processing phases and WORLD09 test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # same reviewed official pin
        with:
          name: world09-processing-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .local/world09-processing-world09-offline-*.json
            .local/world09-offline-*/world09-tests.tap
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
