name: Offline validation (no game runtime)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: offline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline:
    name: offline-node-${{ matrix.node }}
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node: [22.23.4, 24.19.0]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # publisher v6 ref, reviewed 2026-10-25
        with:
          persist-credentials: false
          # The regression runs the exact pre-fix relay and producer source.
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6 official reviewed pin
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - name: Validate original controls, bounded expiry diagnostics and matched WORLD12 processing
        shell: pwsh
        run: ./tools/Test-Offline12.ps1
      - name: Retain sanitized WORLD12 functional, expiry and separate timing evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2, reused reviewed official pin
        with:
          name: world12-offline-${{ matrix.node }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .local/world12-offline-*/artifact/*.tap
            .local/world12-offline-*/artifact/*.json
            .local/world12-ci-*.json
            .local/world12-current-ci-*/snapshot12.json
            .local/world12-baseline-ci-*/snapshot12.json
            .local/world12-retention-control-*.json
            .local/world12-lifecycle-control-*.json
            .local/expiry-ci-evidence/*.json
            .local/expiry12-ci-evidence/*.json
            .local/world11-retention-control-*.json
            .local/world11-lifecycle-control-*.json
            .local/world10-retention-control-*.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
