name: Offline validation (no game runtime)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: offline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # publisher v6 ref, reviewed 2026-10-25
        with:
          persist-credentials: false
          # The regression runs the exact pre-fix relay and producer source.
          fetch-depth: 0
      - name: Validate original controls and bounded processing without a source-built Core
        shell: pwsh
        run: ./tools/Test-Offline10.ps1
      - name: Retain sanitized WORLD10 functional and timing evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2, reused reviewed official pin
        with:
          name: world10-offline-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .local/world10-offline-*/artifact/*.tap
            .local/world10-offline-*/artifact/result.json
            .local/world10-offline-*/artifact/performance.json
            .local/world10-ci-*.json
            .local/world10-current-ci-*/snapshot10.json
            .local/world10-retention-control-*.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
